version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rn-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app
      - ./logs:/logs
      - ./data:/data
    environment:
      - LOG_DIR=/logs
      - DATA_DIR=/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rn-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
