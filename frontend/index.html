<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сверка банковских платежей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Сверка банковских платежей</h1>
        <p class="subtitle">Загрузите оба файла для сверки данных</p>
        
        <div class="upload-section">
            <div class="upload-box">
                <h3> Банковские платежи</h3>
                <p class="hint">Файл из папки Банк-клиент (Excel)</p>
                <input type="file" id="bankFile" accept=".xlsx,.xls">
                <div class="file-status" id="bankStatus">Файл не выбран</div>
            </div>
            
            <div class="upload-box">
                <h3> Выгрузка РН-Карт</h3>
                <p class="hint">Файл из папки #1Выгрузка (Excel)</p>
                <input type="file" id="rnFile" accept=".xlsx,.xls">
                <div class="file-status" id="rnStatus">Файл не выбран</div>
            </div>
        </div>
        
        <div class="action-section">
            <button id="reconcileBtn" disabled>▶ Запустить сверку</button>
            <div id="loading" class="hidden">⏳ Обработка...</div>
        </div>
        
        <div id="results" class="hidden">
            <h2> Результаты сверки</h2>
            <div id="resultContent"></div>
        </div>
        
        <div id="error" class="hidden error"></div>
        
        <div class="status-bar">
            <span id="status">✅ Система готова</span>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
